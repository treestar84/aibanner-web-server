name: Server CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --import tsx scripts/test-mcp-hardening.mjs
      # Compile/typecheck without granting PR code access to the production DB.
      # Full prerender build runs during release validation/deployment.
      - run: npm run build -- --experimental-build-mode compile
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
      - run: npm audit --omit=dev
